name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported MC 26.x versions; 26.2 is the version-catalog default.
        # The properties override the catalog in :adapter and :example-mod.
        # fabric-api releases are MC-version-specific, so each MC version
        # pins its own matching fabric-api build.
        include:
          - minecraft: "26.1"
            fabric-api: "0.145.1+26.1"
          - minecraft: "26.1.2"
            fabric-api: "0.154.2+26.1.2"
          - minecraft: "26.2"
            fabric-api: "0.154.2+26.2"
    steps:
      - uses: actions/checkout@v4

      # JDK to run Gradle itself; the JDK 25 build toolchain is
      # auto-provisioned by the foojay resolver.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: >-
          ./gradlew build
          -Pskein.minecraft.version=${{ matrix.minecraft }}
          -Pskein.fabricapi.version=${{ matrix.fabric-api }}
          --stacktrace

      # The dev environment is covered by `build` (fabric-loader-junit);
      # this is the production side of the matrix — the built jars on the
      # real Fabric server launcher, plus the opt-in production REPL.
      - name: Production REPL smoke test
        run: >-
          ./gradlew :example-mod:prodReplSmokeTest
          -Pskein.minecraft.version=${{ matrix.minecraft }}
          -Pskein.fabricapi.version=${{ matrix.fabric-api }}
          --stacktrace

      # Skein Scripts on the same real server: a script loads at the
      # server-started phase, a deps.edn resolves a library in production,
      # and reload! hot-reloads the script over the opt-in REPL.
      - name: Skein Scripts production smoke test
        run: >-
          ./gradlew :skein-scripts:prodReplSmokeTest
          -Pskein.minecraft.version=${{ matrix.minecraft }}
          -Pskein.fabricapi.version=${{ matrix.fabric-api }}
          --stacktrace
