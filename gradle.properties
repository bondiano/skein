# Applies to every project in the build.
group=io.github.bondiano
# The base adapter semver — the single source of truth for the version. The
# published adapter mod appends the bundled Clojure as SemVer build metadata,
# <adapter-semver>+clojure.<clojure-version> (wired in adapter/build.gradle.kts
# from the version catalog); Maven/Gradle artifact coordinates use this base
# as-is. Bump it here for a release (drop -SNAPSHOT).
version=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
