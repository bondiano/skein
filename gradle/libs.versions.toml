# Single source of truth for versions — never hardcode them in module build files.
# Fabric versions: https://fabricmc.net/develop
# MC 26.1+ is unobfuscated: no yarn/intermediary, no remapping —
# the loom plugin id is the new non-remapping `net.fabricmc.fabric-loom`.

[versions]
clojure = "1.12.5"
# Transitive deps of org.clojure:clojure 1.12.5 — versions must match its pom
# (JiJ `include` is non-transitive, so they are listed explicitly).
clojure-spec = "0.5.238"
clojure-core-specs = "0.4.74"
nrepl = "1.7.0"
# add-lib in the dev REPL (dev-only classpath, never shipped)
tools-deps = "0.23.1512"
# Malli powers boundary schema validation for the FP layer (item/blockstate/
# register!/command/text data) and mixins.edn. It is bundled in the adapter and
# added to a mod's classpath by the gradle plugin — a runtime dependency of mods.
malli = "0.17.0"
# malli's only non-optional runtime dependency (lazy-loads fipp/edamame/test.check
# through it; those are not needed for validate/explain/humanize, so only these two
# ship). Bundled in the adapter alongside malli.
dynaload = "0.3.5"
# clojure.tools.logging -> the game's log4j/slf4j, so mod handlers log through the
# server logger with the right mod id. Pure Clojure, no transitive deps; bundled in
# the adapter.
tools-logging = "1.3.1"
# Test-only stand-ins for what the Fabric dev classpath provides at build
# time (Loom installs the loader's own libraries there): ASM for the mixin
# codegen, sponge-mixin for the callback classes.
asm = "9.10.1"
sponge-mixin = "0.17.3+mixin.0.8.7"
slf4j = "2.0.17"
fabric-loader = "0.19.3"
# Fabric installer generation for the meta.fabricmc.net server-launcher URL
# (production REPL smoke test downloads fabric-server-launch with it).
fabric-installer = "1.1.1"
minecraft = "26.2"
fabric-api = "0.154.2+26.2"
loom = "1.17.14"
junit = "5.13.4"
junit-platform = "1.13.4"
# Build hygiene (Java lint/format; run in the Gradle daemon's JVM)
spotless = "7.0.4"
palantir-java-format = "2.68.0"
checkstyle = "10.26.1"

[libraries]
clojure = { module = "org.clojure:clojure", version.ref = "clojure" }
clojure-spec = { module = "org.clojure:spec.alpha", version.ref = "clojure-spec" }
clojure-core-specs = { module = "org.clojure:core.specs.alpha", version.ref = "clojure-core-specs" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
nrepl = { module = "nrepl:nrepl", version.ref = "nrepl" }
tools-deps = { module = "org.clojure:tools.deps", version.ref = "tools-deps" }
malli = { module = "metosin:malli", version.ref = "malli" }
dynaload = { module = "borkdude:dynaload", version.ref = "dynaload" }
tools-logging = { module = "org.clojure:tools.logging", version.ref = "tools-logging" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
# Loom as a library — compileOnly in the gradle plugin to configure run configs
loom-lib = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
