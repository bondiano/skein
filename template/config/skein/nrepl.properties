# Production nREPL configuration for this mod's server.
#
# In a Loom dev run the nREPL server starts automatically (127.0.0.1:7888 by
# default). In production it is strictly OFF unless you enable it here, and it
# only ever binds a loopback address: an nREPL session is full control of the
# JVM, so the port must never be reachable from the network — tunnel in over
# SSH for remote access instead of opening the bind address.
#
# Every key below can also be set as a JVM system property (e.g.
# -Dskein.nrepl.enabled=true), which wins over this file.

# Turn the production REPL on. Off by default.
#enabled=true

# Port to listen on (default 7888).
#port=7888

# Bind address. Must be a loopback address in production (default 127.0.0.1).
#bind=127.0.0.1

# Run every eval on the game thread (default false). Convenient for quick
# world edits; leave off if you want to manage threading yourself with
# skein.interop/on-server.
#game-thread-eval=false
